name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

# Named explicitly: when release.yml calls this, github.workflow is the caller's name.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.4xx
      - name: Markd.Core.Tests
        run: dotnet test --project Markd.Core.Tests/Markd.Core.Tests.csproj -c Release
      - name: Markd.Tests
        run: dotnet test --project Markd.Tests/Markd.Tests.csproj -c Release
